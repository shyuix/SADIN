<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SADIN test page - simulated AI assistant</title>
<style>
  :root{--bg:#f6f6f4;--card:#fff;--ink:#1d2322;--muted:#6c7573;--line:#e2e5e3;--accent:#2b2f36}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 "IBM Plex Sans Arabic","IBM Plex Sans",system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);height:100vh;display:grid;grid-template-columns:1fr 380px;grid-template-rows:auto 1fr}
  .banner{grid-column:1/-1;background:#fff4d6;border-bottom:1px solid #eadca8;color:#5c4a12;font-size:12px;padding:6px 16px}
  main{display:flex;flex-direction:column;min-height:0}
  .top{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card)}
  .logo{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
  .top b{font-size:15px}.top span{color:var(--muted);font-size:13px}
  #thread{flex:1;overflow:auto;padding:24px 10%}
  .msg{max-width:720px;margin:0 0 14px auto;background:#e9ecef;border-radius:14px;padding:10px 14px;white-space:pre-wrap;word-break:break-word}
  .msg.ai{margin:0 auto 14px 0;background:var(--card);border:1px solid var(--line)}
  .msg img{max-width:320px;border-radius:8px;display:block;margin-top:8px;border:1px solid var(--line)}
  .composer{margin:0 10% 22px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;background:#fafafa}
  .chip img{width:36px;height:28px;object-fit:cover;border-radius:4px}
  textarea{width:100%;border:0;outline:0;resize:none;font:inherit;min-height:64px;max-height:260px;padding:6px}
  .row{display:flex;justify-content:space-between;align-items:center}
  .icon-btn{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
  .send{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:8px 16px;font:inherit;cursor:pointer}
  aside{border-left:1px solid var(--line);background:#fbfbfa;display:flex;flex-direction:column;min-height:0}
  aside h3{margin:0;padding:14px 16px;font-size:13px;border-bottom:1px solid var(--line)}
  aside h3 small{display:block;color:var(--muted);font-weight:400}
  #wire{flex:1;overflow:auto;padding:12px 16px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
  #wire .req{border:1px dashed #cfd5d3;border-radius:8px;padding:8px;margin-bottom:10px;background:#fff}
  #wire img{max-width:100%;margin-top:6px;border-radius:6px}
</style>
</head>
<body>
<div class="banner">Local test page for the SADIN prototype. It imitates an AI chat so the extension can be demonstrated offline. Nothing on this page leaves the machine.</div>
<main>
  <div class="top">
    <div class="logo"><svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="#fff" stroke-width="3"/></svg></div>
    <div><b>Public AI assistant</b> <span>simulated</span></div>
  </div>
  <div id="thread"></div>
  <div class="composer">
    <div class="chips" id="chips"></div>
    <textarea id="prompt" placeholder="Message the assistant" dir="auto"></textarea>
    <div class="row">
      <label class="icon-btn" title="Attach file">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"><path d="M21 11.5 12.5 20a5 5 0 0 1-7-7L14 4.5a3.3 3.3 0 0 1 4.7 4.7L10.2 17.7a1.7 1.7 0 0 1-2.4-2.4L15.5 7.6"/></svg>
        <input type="file" id="file" multiple hidden>
      </label>
      <button class="send" id="send" aria-label="Send message" data-testid="send-button">Send</button>
    </div>
  </div>
</main>
<aside>
  <h3>Received by the AI vendor<small>Exactly what left the organisation</small></h3>
  <div id="wire"></div>
</aside>
<script>
  const prompt = document.getElementById("prompt"), chips = document.getElementById("chips");
  const thread = document.getElementById("thread"), wire = document.getElementById("wire");
  let attachments = [];
  function addFiles(files) {
    for (const f of files) {
      attachments.push(f);
      const c = document.createElement("div"); c.className = "chip";
      if (f.type.startsWith("image/")) { const i = new Image(); i.src = URL.createObjectURL(f); c.appendChild(i); }
      c.appendChild(document.createTextNode(f.name));
      chips.appendChild(c);
    }
  }
  prompt.addEventListener("paste", e => { const f = [...(e.clipboardData.files || [])]; if (f.length) { e.preventDefault(); addFiles(f); } });
  document.getElementById("file").addEventListener("change", e => { addFiles([...e.target.files]); e.target.value = ""; });
  document.addEventListener("dragover", e => e.preventDefault());
  document.addEventListener("drop", e => { e.preventDefault(); addFiles([...(e.dataTransfer.files || [])]); });
  async function send() {
    const text = prompt.value.trim();
    if (!text && !attachments.length) return;
    const m = document.createElement("div"); m.className = "msg"; m.textContent = text;
    const req = document.createElement("div"); req.className = "req"; req.textContent = "POST /v1/chat\n" + text;
    for (const f of attachments) {
      if (f.type.startsWith("image/")) {
        const u = URL.createObjectURL(f);
        const i1 = new Image(); i1.src = u; m.appendChild(i1);
        const i2 = new Image(); i2.src = u; req.appendChild(i2);
      } else {
        const body = f.type.startsWith("text/") || /\.(txt|conf|cfg|env|log|json|ya?ml|csv)$/i.test(f.name) ? await f.text() : "(binary " + f.size + " bytes)";
        req.appendChild(document.createTextNode("\n--- " + f.name + " ---\n" + body));
        m.appendChild(document.createTextNode("\n[" + f.name + "]"));
      }
    }
    thread.appendChild(m); wire.prepend(req);
    const a = document.createElement("div"); a.className = "msg ai"; a.textContent = "(simulated reply) Message received.";
    thread.appendChild(a); thread.scrollTop = thread.scrollHeight;
    prompt.value = ""; attachments = []; chips.innerHTML = "";
  }
  document.getElementById("send").addEventListener("click", send);
  prompt.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
</script>
</body>
</html>
